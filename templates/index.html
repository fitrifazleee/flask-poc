<!DOCTYPE html>
<html>
<head>
    <style>
        /* Base Page Styling */
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background-color: white;
        }
        
        /* Main Top Row Buttons */
        .btn { 
            padding: 12px 20px; 
            margin: 10px; 
            cursor: pointer; 
            font-size: 16px;
            border: 1px solid #ccc; 
            border-radius: 5px; 
            background-color: #f8f9fa;
        }
        
        /* The Target Green Button */
        .true-btn { 
            background-color: #4CAF50; 
            color: white; 
            border: none; 
            font-weight: bold;
        }
        
        /* THE CRITICAL FIX: The Relative Container */
        /* This keeps the floating menu attached to the button */
        .dropdown-container {
            position: relative;
            display: inline-block;
        }

        /* The Floating Dropdown Menu */
        .dropdown-menu {
            display: none; /* Hidden by default */
            position: absolute;
            top: 100%; /* Puts it directly below the button */
            left: 10px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.15); /* Adds the floating shadow */
            z-index: 100; /* Ensures it floats ON TOP of other elements */
            min-width: 220px;
            padding: 5px 0;
        }

        /* The class that JavaScript adds to make it visible */
        .dropdown-menu.show {
            display: block;
        }

        /* The 6 Option Buttons inside the menu */
        .drop-item {
            display: block;
            width: 100%;
            padding: 12px 16px;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            color: #333;
        }

        /* Highlight effect when hovering over options */
        .drop-item:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
    <h2>Dashboard Automated Click Test</h2>

    <div id="mainButtons">
        <button class="btn">Reboot</button>
        
        <div class="dropdown-container">
            <button id="trueBtn" class="btn true-btn">Tekan Saya</button>
            
            <div id="dropdownMenu" class="dropdown-menu">
                <button class="drop-item">Option 1: Calibrate Sensor</button>
                <button class="drop-item">Option 2: Run Diagnostics</button>
                <button id="correctOption" class="drop-item">Option 3: Log Time</button>
                <button class="drop-item">Option 4: Reset Network</button>
                <button class="drop-item">Option 5: Export CSV</button>
                <button class="drop-item">Option 6: Ping Server</button>
            </div>
        </div>

        <button class="btn">Clear Cache</button>
    </div>

    <hr>
    <p><strong>Total Logs:</strong> {{ logs|length }}</p>
    <ul>
        {% for log in logs %}
        <li>{{ log }}</li>
        {% endfor %}
    </ul>

    <script>
        // Logic to toggle the floating dropdown on/off
        document.getElementById('trueBtn').addEventListener('click', function() {
            document.getElementById('dropdownMenu').classList.toggle('show');
        });

        // Logic to shoot the data to the Python backend and refresh
        document.getElementById('correctOption').addEventListener('click', function() {
            fetch('/click', { method: 'POST' })
            .then(response => location.reload());
        });
    </script>
</body>
</html>
