<!DOCTYPE html>
<html>
<head>
    <style>
        /* Base Page Styling */
        body { font-family: sans-serif; padding: 20px; background-color: white; }
        .hidden { display: none; }

        /* EXACT ORIGINAL BUTTON CSS - Restored so your vision engine works */
        .btn { 
            padding: 15px 25px; 
            margin: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            background-color: #ddd; 
            border: 1px solid #999; 
            border-radius: 5px; 
        }
        .true-btn { 
            background-color: #4CAF50; 
            color: white; 
            border: none; 
        }

        /* FLOATING DROPDOWN CSS */
        .dropdown-container {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 10px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.15);
            z-index: 100;
            min-width: 220px;
            padding: 5px 0;
        }

        .dropdown-menu.show {
            display: block;
        }

        .drop-item {
            display: block; 
            width: 100%; 
            margin: 2px 0; 
            padding: 10px; 
            text-align: left; 
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #888;
            color: black;
            font-size: 14px;
        }

        .drop-item:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <h2>Dashboard Automated Click Test</h2>

    <div id="mainButtons">
        <button class="btn">Reboot</button>
        
        <div class="dropdown-container">
            <button id="trueBtn" class="btn true-btn">Tekan Saya</button>
            
            <div id="dropdownMenu" class="dropdown-menu">
                <button class="drop-item">Option 1: Calibrate Sensor</button>
                <button class="drop-item">Option 2: Run Diagnostics</button>
                <button id="correctOption" class="drop-item">Option 3: Log Time</button>
                <button class="drop-item">Option 4: Reset Network</button>
                <button class="drop-item">Option 5: Export CSV</button>
                <button class="drop-item">Option 6: Ping Server</button>
            </div>
        </div>

        <button class="btn">Clear Cache</button>
    </div>

    <hr>
    <p><strong>Total Logs:</strong> {{ logs|length }}</p>
    <ul>
        {% for log in logs %}
        <li>{{ log }}</li>
        {% endfor %}
    </ul>

    <script>
        // Logic to toggle the floating dropdown on/off
        document.getElementById('trueBtn').addEventListener('click', function() {
            document.getElementById('dropdownMenu').classList.toggle('show');
        });

        // Logic to shoot the data to the Python backend and refresh
        document.getElementById('correctOption').addEventListener('click', function() {
            fetch('/click', { method: 'POST' })
            .then(response => location.reload());
        });
    </script>
</body>
</html>
